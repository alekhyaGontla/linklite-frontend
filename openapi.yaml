openapi: 3.0.0
info:
  title: Linklite AI Agent API
  version: 1.0.0
  description: Backend API service powering the AI copilot and agent features for Linklite.
servers:
  - url: http://localhost:3000/api
    description: Local development server

paths:
  /ai/chat:
    post:
      summary: Send a message to the AI Agent / Copilot
      description: Processes user queries using the integrated LLM service and returns an AI-generated response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: The prompt or question sent to the AI agent.
                  example: "How many active URLs do I have?"
                userEmail:
                  type: string
                  format: email
                  description: Optional context identifier for the user.
                  example: "user@example.com"
      responses:
        '200':
          description: Successful AI response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  reply:
                    type: string
                    description: The text response generated by the AI agent.
                    example: "You currently have 5 active URLs."
        '500':
          description: Internal server error (e.g., missing OpenAI credentials or API failure)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Failed to generate AI response"